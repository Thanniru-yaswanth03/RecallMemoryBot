<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecallMemoryBot Admin Login</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
    <style>
        body {
            display: block !important;
            width: 100vw !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #0b0f19 !important;
            overflow-x: hidden;
        }
        .login-wrapper {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
            box-sizing: border-box;
        }
        .login-card {
            width: 100%;
            max-width: 460px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 2.75rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
        }
        .login-subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .alert-box {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🧠</div>
                <h1 class="login-title">RecallMemoryBot</h1>
                <p class="login-subtitle">Private Operator Administration</p>
            </div>

            <div id="errorAlert" class="alert-box alert-error"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Operator Username</label>
                    <input type="text" id="username" class="form-input" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" required autocomplete="current-password">
                </div>

                <button type="submit" id="submitBtn" class="btn-login">Sign In to Console</button>
            </form>
        </div>
    </div>

    <script src="/admin/js/admin-api.js"></script>
    <script>
        // Check if already authenticated
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await AdminApi.getMe();
                if (res && res.authenticated) {
                    window.location.href = '/admin/';
                }
            } catch (e) {
                // Not logged in, stay on login page
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');
            alertBox.style.display = 'none';

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            try {
                const data = await AdminApi.login(user, pass);
                if (data && data.token) {
                    localStorage.setItem('recall_admin_token', data.token);
                    localStorage.setItem('recall_admin_user', data.username);
                    window.location.href = '/admin/';
                }
            } catch (err) {
                alertBox.textContent = err.message || 'Login failed. Check credentials.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to Console';
            }
        }
    </script>
</body>
</html>
